<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>R.R Portal | Login</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; 
            background: url("{{ url_for('static', filename='images/college_bg.jpeg') }}") no-repeat center center fixed; 
            background-size: cover; 
        }
        .login-container { 
            background: rgba(255, 255, 255, 0.95); width: 450px; padding: 40px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); text-align: center; backdrop-filter: blur(5px); 
        }
        .error-msg { background: #ffebee; color: #d32f2f; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; font-weight: bold; border: 1px solid #ffcdd2; }
        .selection-area { display: flex; gap: 20px; justify-content: center; margin: 30px 0; }
        .role-card { flex: 1; padding: 20px; border: 2px solid #eee; border-radius: 15px; cursor: pointer; transition: 0.3s; background: white; }
        .role-card.active-student { border-color: #004aad; background: #eef2ff; }
        .role-card.active-admin { border-color: #b71c1c; background: #fff1f1; }
        .icon { font-size: 50px; margin-bottom: 10px; display: block; }
        #login-form { display: none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
        .login-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="{{ url_for('static', filename='images/logo.png') }}" height="80">
        <h2>R.R College Portal</h2>
        
        {% if error %}<div class="error-msg">⚠️ {{ error }}</div>{% endif %}

        <p>Select your portal to continue</p>
        <div class="selection-area">
            <div class="role-card" id="card-student" onclick="setMode('student')"><span class="icon">🎓</span><strong>Student</strong></div>
            <div class="role-card" id="card-admin" onclick="setMode('admin')"><span class="icon">👨‍🏫</span><strong>Staff</strong></div>
        </div>

        <div id="login-form">
            <form method="POST" action="/">
                <input type="hidden" id="selected_role" name="selected_role" value="student">
                <input type="text" id="username" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="login-btn" id="submit-btn">Login</button>
            </form>
        </div>
    </div>

    <script>
        function setMode(mode) {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('selected_role').value = mode;
            const btn = document.getElementById('submit-btn');
            const sCard = document.getElementById('card-student');
            const aCard = document.getElementById('card-admin');
            
            if (mode === 'admin') {
                btn.innerText = "Enter Staff Portal"; btn.style.backgroundColor = "#b71c1c";
                aCard.classList.add('active-admin'); sCard.classList.remove('active-student');
            } else {
                btn.innerText = "View My Performance"; btn.style.backgroundColor = "#004aad";
                sCard.classList.add('active-student'); aCard.classList.remove('active-admin');
            }
        }
    </script>
</body>
</html>
